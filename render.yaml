# Render Blueprint (free plan). Railway also picks up the Dockerfile directly.
services:
  - type: web
    name: spherex-api
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      # Origin used to build absolute image URLs, e.g. https://spherex-api.onrender.com
      # (unset: taken from each request, which also works behind Render's proxy).
      - key: PUBLIC_BASE
        sync: false
      - key: CORS_ORIGINS
        value: "*"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      # SIMBAD for GET /api/v1/catalog-objects: the official Harvard mirror. On 2026-11-15 the CDS host
      # (https://simbad.cds.unistra.fr/simbad/sim-tap/sync, the code's default) answered 404. To go back
      # to CDS, change or delete this value.
      - key: SIMBAD_TAP_URL
        value: https://simbad.cfa.harvard.edu/simbad/sim-tap/sync
